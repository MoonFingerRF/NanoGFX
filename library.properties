name=NanoGFX
version=1.4.0
author=MoonFingerRF
maintainer=MoonFingerRF
sentence=15-color packed-nibble graphics: 2 pixels/byte canvases with RLE fused into drawing, dirty-band flushing for TFT/AMOLED, and a non-blocking 1-bit e-paper pipeline (UC8179, per-region ghosting policy).
paragraph=An Adafruit_GFX-compatible palette canvas that stores 2 pixels per byte and can keep each line as a run-list so most of an RLE encode happens during drawing. Includes the PackRLE codec (15 colors + escape nibble), PackFlush (push only the rows that changed), ESP32 QSPI AMOLED (RM690B0) and SPI TFT (ST7789) drivers with split-polling writes, PackMono (dithered 1-bit export), a non-blocking UC8179 800x480 e-paper driver (Seeed reTerminal E1001, Waveshare 7.5" V2) and EInkGhost (partial / clean-window / full refresh by per-row wear). Also builds without Arduino (ESP-IDF, ESPHome, host). Battle-tested at 46+ fps on a 450x600 AMOLED with WiFi and BLE running on the same ESP32-S3.
category=Display
